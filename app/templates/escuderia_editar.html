{% extends "base.html" %}
{% block titulo %}Editar escudería{% endblock %}
{% block contenido %}
<h1>Editar escudería</h1>
<p class="sub">{{ esc.nombre }}</p>
<section class="tarjeta">
  <form method="post" class="fila">
    <div><label for="nombre">Nombre</label><input id="nombre" name="nombre" value="{{ form.nombre }}" required></div>
    <div><label for="pais">País</label><input id="pais" name="pais" value="{{ form.pais }}" required></div>
    <div class="acciones" style="justify-content:flex-start">
      <button type="submit">Guardar</button>
      <a class="boton secundario" href="{{ url_for('pitwall.escuderias') }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
